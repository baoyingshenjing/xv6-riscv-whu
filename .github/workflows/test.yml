name: Course labs

on: [push, pull_request]

jobs:
  labs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install RISC-V tools
        run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-linux-gnu qemu-system-misc bc xxd
      - name: Verify nine course stages
        run: make test-labs
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lab-test-logs
          path: /tmp/xv6-labs-*/*.log
